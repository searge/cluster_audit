---
# Thin by design: every job is one call into scripts/ci/, so the logic is
# runnable and testable outside GitLab. Pipeline shape follows git-mm-bridge
# (Harbor + rootless BuildKit + hadolint/trivy/dockle); there is no deploy
# stage — the CronJob that runs this image lives in the ovh-cluster GitOps repo.
stages:
  - test
  - build
  - scan

default:
  tags:
    - galaxy-docker-shared

.dockerfile-changes: &dockerfile_changes
  - .dockerignore
  - Dockerfile

.python-docker-changes: &python_docker_changes
  - .dockerignore
  - Dockerfile
  - pyproject.toml
  - uv.lock
  - Taskfile.yaml
  - scripts/ci/**/*
  - src/**/*
  - config/**/*

variables:
  HARBOR_REGISTRY: registry.galaxy.intranet
  IMAGE_NAME: ${HARBOR_REGISTRY}/galaxy/mks-audit
  CACHE_IMAGE: ${HARBOR_REGISTRY}/galaxy/mks-audit:buildcache
  # DHI: `-dev` (shell + pip + root) builds, the plain tag runs. Both must be
  # the same OS so the copied venv keeps pointing at a real interpreter.
  PYTHON_BUILD_IMAGE: ${HARBOR_REGISTRY}/dhi/python:3.13-debian13-dev
  PYTHON_RUNTIME_IMAGE: ${HARBOR_REGISTRY}/dhi/python:3.13-debian13
  UV_VERSION: 0.9.6
  TASK_VERSION: 3.52.0

########################################################################
# Python
########################################################################

test:gate:
  stage: test
  image: ${PYTHON_BUILD_IMAGE}
  interruptible: true
  variables:
    UV_CACHE_DIR: ${CI_PROJECT_DIR}/.uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *python_docker_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths: *python_docker_changes
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - scripts/ci/gate.sh

########################################################################
# Docker
########################################################################

test:hadolint:
  stage: test
  image: ${HARBOR_REGISTRY}/library/docker-scanner:latest
  interruptible: true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *dockerfile_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths: *dockerfile_changes
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - hadolint Dockerfile

test:trivy:config:
  stage: test
  image: ${HARBOR_REGISTRY}/library/docker-scanner:latest
  interruptible: true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *dockerfile_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths: *dockerfile_changes
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - trivy config Dockerfile

########################################################################
# Image
########################################################################

build:image:
  stage: build
  tags: ["galaxy-buildx-rootless"]
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  needs:
    - job: test:gate
    - job: test:hadolint
      optional: true
    - job: test:trivy:config
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths: *python_docker_changes
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - scripts/ci/build-image.sh

scan:dockle:
  stage: scan
  image: ${HARBOR_REGISTRY}/library/docker-scanner:latest
  needs: [build:image]
  variables:
    DOCKER_CONTENT_TRUST: "1"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths: *python_docker_changes
    - if: $CI_COMMIT_TAG
    - when: never
  before_script:
    - mkdir -p "${HOME:-/root}/.docker"
    - |
      if [ -n "${DOCKER_AUTH_CONFIG:-}" ]; then
        printf '%s' "${DOCKER_AUTH_CONFIG}" > "${HOME:-/root}/.docker/config.json"
      fi
  script:
    - dockle "${IMAGE_NAME}:${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
