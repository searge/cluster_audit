[project]
name = "mks-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# Runtime only — what `src/mks` actually imports. Notebook tooling lives in the
# `notebooks` group below, so the container image does not ship Jupyter.
# `diskcache` looks unused but is loaded via importlib in `ovh_client` and
# `rancher_users_export_service` — do not "clean it up".
dependencies = [
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "pandas>=2.3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "typer>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mks"]

[project.scripts]
mks = "mks.cli.main:main"

[project.optional-dependencies]
ovh = ["ovh>=1.2.0"]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=8.4.2",
    "pylance>=0.32.0",
    "pylint>=4.0.4",
    "ruff>=0.12.7",
    "ty>=0.0.15",
]
# Exploratory only, used from notebooks/ — never imported by src/mks.
# The old `google` pin was dropped: that PyPI package is an empty namespace
# stub. The notebooks import `google.colab` (only exists inside the Colab
# runtime) and `google.auth` (which ships in `google-auth`) — neither ever came
# from it. Notebooks are Colab-first by design, so nothing is added back here.
notebooks = [
    "jupyter>=1.1.1",
    "kubernetes>=35.0.0",
    "plotly>=6.6.0",
]


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "RET", # flake8-return
    "FURB", # refurb
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.uv]
package = true
# Both groups install on a plain `uv sync`, so local work is unchanged.
# The image build passes --no-default-groups to get runtime deps only.
default-groups = ["dev", "notebooks"]
