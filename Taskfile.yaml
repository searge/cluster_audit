---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  UV_ENV: "env VIRTUAL_ENV={{.PWD}}/.venv UV_CACHE_DIR=.uv-cache MYPY_CACHE_DIR=.mypy_cache PYLINTHOME=.pylint_cache"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install/update dependencies
    cmds:
      - "{{.UV_ENV}} uv sync"

  mks:
    desc: "Run mks CLI without activating venv (example: task mks -- resource-audit -h)"
    cmds:
      - '{{.UV_ENV}} uv run mks {{.CLI_ARGS | default "--help"}}'

  ovh:
    desc: "Run any OVH-API mks command with the ovh extra (example: task ovh -- cluster-inventory -r reports)"
    cmds:
      - '{{.UV_ENV}} uv run --extra ovh mks {{.CLI_ARGS | default "--help"}}'

  billing:
    desc: "Export [OVH MKS] Payment CSV (example: task billing -- --from 2025-02 --to 2026-06 -r reports)"
    cmds:
      - '{{.UV_ENV}} uv run --extra ovh mks billing-export {{.CLI_ARGS | default "--help"}}'

  lint:
    desc: Run code quality checks
    cmds:
      - "{{.UV_ENV}} uv run ruff format {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run ruff check --fix {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run ty check {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run pylint {{.CLI_ARGS | default '.'}} -j 1"

  typecheck:
    desc: Run type checking
    cmds:
      - "{{.UV_ENV}} uv run python -m mypy {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run pyright {{.CLI_ARGS | default '.'}}"

  test:
    desc: Run all checks
    deps: [lint, typecheck]
    cmds:
      - echo "✅ All checks passed"

  ci:
    desc: "Same gate as `test`, but non-mutating — CI must fail, not reformat"
    cmds:
      - "{{.UV_ENV}} uv run ruff format --check {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run ruff check {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run ty check {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run pylint {{.CLI_ARGS | default '.'}} -j 1"
      - "{{.UV_ENV}} uv run python -m mypy {{.CLI_ARGS | default '.'}}"
      - "{{.UV_ENV}} uv run pyright {{.CLI_ARGS | default '.'}}"

  local-up:
    desc: "Local capacity stack (Postgres + Grafana on :3000). Needs a Prometheus port-forward."
    cmds:
      - podman-compose up -d
      - echo "Grafana → http://localhost:3000 (admin/admin)"

  local-ingest:
    desc: "Pull one snapshot into the local Postgres (port-forward Prometheus to :19090 first)"
    cmds:
      # Rebuild first — this runs the image, not the working tree, and a stale
      # image silently ingests with the previous version's queries.
      - podman-compose --profile tools build ingest
      - podman-compose --profile tools run --rm ingest
      # podman-compose rebuilds the project when the profile set changes, which
      # stops the services outside the profile. Put Grafana back.
      - podman-compose up -d

  local-down:
    desc: "Stop the local stack (add -- -v to drop the database volume too)"
    cmds:
      - 'podman-compose down {{.CLI_ARGS}}'

  clean:
    desc: Clean up old report files (>14 days)
    cmds:
      - find reports/ -name "*.csv" -type f -mtime +14 -delete
      - find reports/ -name "*.md" -type f -mtime +7 -delete
      - echo "🗑️ Cleanup completed"
